<!doctype html>
<meta charset="utf-8" />
<title>VIDAA Home window regression</title>
<style>
  body {
    margin: 0;
    background: #121212;
    color: white;
    font: 16px monospace;
  }
  .home-main {
    width: 800px;
    height: 320px;
    overflow: auto;
  }
  .home-row {
    margin-bottom: 20px;
  }
  .home-track {
    display: flex;
    gap: 20px;
    overflow: auto;
  }
  .home-grid-track {
    display: grid;
    grid-template-columns: repeat(3, 180px);
    gap: 20px;
  }
  .home-content-card {
    box-sizing: border-box;
    flex: 0 0 180px;
  }
  .home-poster-frame {
    width: 180px;
    height: 240px;
  }
  img {
    width: 180px;
    height: 240px;
  }
  .vidaa-card-parked {
    visibility: hidden;
  }
  #result {
    white-space: pre-wrap;
  }
</style>
<div id="fixture"></div>
<pre id="result">Testing...</pre>
<script type="module">
  import {
    updateVidaaHomeCardWindow,
    restoreVidaaHomeCard,
    restoreAllVidaaHomeCards,
    restoreVidaaHomeNavigationNeighborhood,
    suspendVidaaHomeCardWindow,
    discardVidaaHomeCards
  } from "../js/ui/screens/home/vidaaHomeCardWindow.js";
  import { releaseDistantVidaaHomeImages } from "../js/ui/screens/home/vidaaHomeImageWindow.js";
  import { patchHomeMarkup } from "../js/ui/screens/home/patchHomeMarkup.js";
  import { updateHomeDom } from "../js/ui/screens/home/homeDomUpdate.js";
  const result = document.getElementById("result");
  try {
    const assert = (condition, message) => {
      if (!condition) throw Error(message);
    };
    const container = document.getElementById("fixture");
    const imageUrl =
      "data:image/svg+xml," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="240"><rect width="180" height="240" fill="teal"/></svg>'
      );
    const markup = `<main class="home-main">${Array.from({ length: 10 }, (_, r) => `<section class="home-row" data-row-key="row-${r}"><div class="home-track">${Array.from({ length: 30 }, (_, c) => `<article tabindex="0" class="home-content-card home-poster-card" data-item-id="${r}-${c}"><div class="home-poster-frame"><img class="content-poster" src="${imageUrl}"></div><button>${r}-${c}</button></article>`).join("")}</div></section>`).join("")}</main>`;
    patchHomeMarkup(container, markup);
    const screen = { container };
    const viewport = container.querySelector("main");
    const cards = Array.from(container.querySelectorAll("article"));
    const tracks = Array.from(container.querySelectorAll(".home-track"));
    const originalSizes = tracks.map((t) => [t.scrollWidth, t.offsetHeight]);
    const originalScrollHeight = viewport.scrollHeight;
    let clicks = 0;
    const distant = cards[299];
    const child = distant.querySelector("button");
    child.addEventListener("click", () => clicks++);
    cards[0].focus({ preventScroll: true });
    releaseDistantVidaaHomeImages(container, viewport.getBoundingClientRect(), cards[0]);
    updateVidaaHomeCardWindow(screen, viewport.getBoundingClientRect(), cards[0]);
    const active = container.querySelectorAll(".home-poster-frame").length;
    assert(active < 80, "Only the viewport neighborhood should retain visual subtrees");
    assert(
      screen.homeVidaaParkedCards.size > 220,
      "Long catalogs must not keep every subtree attached"
    );
    assert(
      container.querySelectorAll("article").length === 300,
      "Remote-navigation anchors must remain mounted"
    );
    assert(
      viewport.scrollHeight === originalScrollHeight,
      "Vertical extent must stay exactly unchanged"
    );
    tracks.forEach((t, i) =>
      assert(
        t.scrollWidth === originalSizes[i][0] && t.offsetHeight === originalSizes[i][1],
        "Track geometry changed"
      )
    );
    assert(document.activeElement === cards[0], "Virtualization must preserve current focus");
    screen.navModel = {
      rows: Array.from({ length: 10 }, (_, rowIndex) =>
        cards.slice(rowIndex * 30, rowIndex * 30 + 30)
      )
    };
    screen.navModel.rows.forEach((rowNodes, rowIndex) =>
      rowNodes.forEach((card, colIndex) => {
        card.dataset.navRow = String(rowIndex);
        card.dataset.navCol = String(colIndex);
      })
    );
    const warmTarget = screen.navModel.rows[5][15];
    const parkedBeforeWarm = screen.homeVidaaParkedCards.size;
    const warmed = restoreVidaaHomeNavigationNeighborhood(screen, warmTarget, "down");
    assert(
      warmed > 0 && warmed <= 14,
      "Navigation warming must restore only a bounded target neighborhood"
    );
    assert(
      warmTarget.querySelector(".home-poster-frame"),
      "The next focus row must regain its visual subtree before settling"
    );
    assert(
      screen.homeVidaaParkedCards.size === parkedBeforeWarm - warmed,
      "Only warmed cards should leave the parked set"
    );
    assert(restoreVidaaHomeCard(screen, distant), "A remote target restores synchronously");
    assert(
      distant.querySelector("button") === child,
      "Restore must preserve actual nodes and listeners"
    );
    assert(
      !distant.querySelector("img").hasAttribute("src") &&
        distant.querySelector("img").dataset.src === imageUrl,
      "Distant images must be deferred and restorable"
    );
    distant.focus({ preventScroll: true });
    child.click();
    assert(
      document.activeElement === distant && clicks === 1,
      "Restored target must accept focus and clicks"
    );
    assert(!distant.style.width && !distant.style.height, "Slot styles must be removed on restore");
    viewport.scrollTop = viewport.scrollHeight;
    tracks[9].scrollLeft = tracks[9].scrollWidth;
    const left = tracks[9].scrollLeft;
    updateVidaaHomeCardWindow(screen, viewport.getBoundingClientRect(), distant);
    assert(distant.querySelector("img"), "Focused card must never park");
    assert(tracks[9].scrollLeft === left, "Moving the window must preserve horizontal scroll");
    const retainedCards = container.querySelectorAll(".home-poster-frame").length;
    const retainedFragments = screen.homeVidaaParkedCards.size;
    screen.homeVidaaCardWindowTimer = setTimeout(() => {
      throw Error("Hidden Home timer ran");
    }, 0);
    screen.homeVidaaCardWindowRaf = requestAnimationFrame(() => {
      throw Error("Hidden Home frame ran");
    });
    suspendVidaaHomeCardWindow(screen);
    for (let trip = 0; trip < 10; trip++) {
      container.style.display = "none";
      container.style.display = "block";
      distant.focus({ preventScroll: true });
      assert(
        container.querySelectorAll(".home-poster-frame").length === retainedCards,
        "Route return must retain the bounded visual window"
      );
      assert(
        screen.homeVidaaParkedCards.size === retainedFragments,
        "Route exit must not reattach distant fragments"
      );
      assert(
        distant.querySelector("button") === child,
        "Route return must preserve actual nodes and listeners"
      );
      assert(
        viewport.scrollHeight === originalScrollHeight && tracks[9].scrollLeft === left,
        "Route return must preserve scroll geometry"
      );
    }
    assert(
      !screen.homeVidaaCardWindowTimer && !screen.homeVidaaCardWindowRaf,
      "Hidden Home maintenance must be cancelled"
    );
    restoreAllVidaaHomeCards(screen);
    patchHomeMarkup(container, markup);
    assert(
      container.querySelectorAll(".home-poster-frame").length === 300,
      "Reconciliation must see the complete restored tree"
    );
    assert(
      distant === container.querySelector('[data-item-id="9-29"]'),
      "Rendering must retain card identity"
    );
    updateVidaaHomeCardWindow(screen, viewport.getBoundingClientRect(), distant);
    restoreAllVidaaHomeCards(screen);
    assert(
      screen.homeVidaaParkedCards.size === 0 &&
        container.querySelectorAll(".vidaa-card-parked").length === 0,
      "Cleanup must release detached fragments"
    );
    // A quiet-window pass over a long horizontal catalog must read the live
    // neighborhood, rather than every slot that was already parked.
    container.innerHTML = `<main class="home-main"><section class="home-row"><div class="home-track">${Array.from({ length: 1000 }, (_, c) => `<article tabindex="0" class="home-content-card" data-nav-row="0" data-nav-col="${c}"><div class="home-poster-frame"></div></article>`).join("")}</div></section></main>`;
    const longViewport = container.querySelector("main");
    const longTrack = container.querySelector(".home-track");
    const longCards = [...longTrack.querySelectorAll("article")];
    screen.navModel = { rows: [longCards] };
    let cardGeometryReads = 0;
    longCards.forEach((card) => {
      const measure = card.getBoundingClientRect.bind(card);
      card.getBoundingClientRect = () => {
        cardGeometryReads++;
        return measure();
      };
    });
    updateVidaaHomeCardWindow(screen, longViewport.getBoundingClientRect(), longCards[0]);
    cardGeometryReads = 0;
    updateVidaaHomeCardWindow(screen, longViewport.getBoundingClientRect(), longCards[0]);
    assert(cardGeometryReads < 40, "Repeated maintenance must bound layout reads for 1000 posters");
    const farTarget = longCards[700];
    restoreVidaaHomeNavigationNeighborhood(screen, farTarget, "right");
    longTrack.scrollLeft = farTarget.offsetLeft;
    cardGeometryReads = 0;
    updateVidaaHomeCardWindow(screen, longViewport.getBoundingClientRect(), farTarget);
    assert(
      cardGeometryReads < 70,
      "A distant jump must discover its window without scanning all posters"
    );
    assert(
      farTarget.querySelector(".home-poster-frame"),
      "Distant jump must retain the focused subtree"
    );
    longTrack.dir = "rtl";
    longTrack.scrollLeft = 0;
    restoreVidaaHomeNavigationNeighborhood(screen, longCards[0], "right");
    cardGeometryReads = 0;
    updateVidaaHomeCardWindow(screen, longViewport.getBoundingClientRect(), longCards[0]);
    assert(cardGeometryReads < 70, "RTL rows must keep the same bounded layout work");
    assert(
      longCards[6].querySelector(".home-poster-frame"),
      "RTL physical-order search must restore the nearby window"
    );
    assert(!farTarget.querySelector(".home-poster-frame"), "RTL must still retire distant trees");
    restoreAllVidaaHomeCards(screen);
    // Grid sections span many rows: retaining their section rect alone must not
    // retain every image/card in the section. Card geometry remains authoritative.
    container.innerHTML = `<main class="home-main"><section class="home-grid-section"><div class="home-grid-track">${Array.from({ length: 60 }, (_, c) => `<article tabindex="0" class="home-content-card home-poster-card"><div class="home-poster-frame"><img class="content-poster" src="${imageUrl}"></div><button>${c}</button></article>`).join("")}</div></section></main>`;
    const gridViewport = container.querySelector("main");
    const gridCards = Array.from(container.querySelectorAll("article"));
    const gridHeight = gridViewport.scrollHeight;
    const gridPositions = gridCards.map((c) => c.offsetTop);
    releaseDistantVidaaHomeImages(container, gridViewport.getBoundingClientRect(), gridCards[0]);
    updateVidaaHomeCardWindow(screen, gridViewport.getBoundingClientRect(), gridCards[0]);
    assert(
      container.querySelectorAll(".home-poster-frame").length < 18,
      "Grid must bound subtrees by card position"
    );
    assert(
      container.querySelectorAll("img[src]").length < 18,
      "Grid must release distant decoded images"
    );
    assert(gridViewport.scrollHeight === gridHeight, "Grid extent must remain unchanged");
    gridCards.forEach((c, i) =>
      assert(c.offsetTop === gridPositions[i], "Grid card positions changed")
    );
    restoreAllVidaaHomeCards(screen);
    updateVidaaHomeCardWindow(screen, gridViewport.getBoundingClientRect(), gridCards[0]);
    const beforeDiscard = container.querySelectorAll(".home-poster-frame").length;
    discardVidaaHomeCards(screen);
    assert(
      container.querySelectorAll(".home-poster-frame").length === beforeDiscard,
      "Discard must not restore doomed card trees"
    );
    assert(
      screen.homeVidaaParkedCards.size === 0 && screen.homeVidaaActiveCards === null,
      "Discard must release window references"
    );

    // Only generated static cards opt in. Large catalogs retain canonical
    // markup, not every detached DOM tree; custom/listener cards above keep
    // their original nodes. The navigation anchor and its listeners survive.
    const recyclableMarkup = `<div class="home-shell"><main class="home-main">${Array.from({ length: 12 }, (_, r) => `<section class="home-row"><div class="home-track">${Array.from({ length: 40 }, (_, c) => `<article tabindex="0" class="home-content-card home-poster-card" data-item-id="recycle-${r}-${c}" data-vidaa-recyclable-card="true"><div class="home-poster-frame"><img class="content-poster" data-src="${imageUrl}"><img class="home-poster-expanded-backdrop" data-src="${imageUrl}" data-load-bound="true"></div><span class="title">Title ${r}-${c}</span></article>`).join("")}</div></section>`).join("")}</main></div>`;
    updateHomeDom(container, recyclableMarkup);
    const recycleViewport = container.querySelector("main");
    const recycleCards = [...container.querySelectorAll("article")];
    const recycleScreen = { container };
    let anchorClicks = 0;
    recycleCards[15].addEventListener("click", () => anchorClicks++);
    const canonicalOldChild = recycleCards[15].firstElementChild;
    const successfulFallback = "https://fixture.invalid/fallback.jpg";
    recycleCards[15].querySelector(".content-poster").dataset.src = successfulFallback;
    updateVidaaHomeCardWindow(
      recycleScreen,
      recycleViewport.getBoundingClientRect(),
      recycleCards[0]
    );
    const recycled = [...recycleScreen.homeVidaaParkedCards.values()].filter(
      (record) => !record.content
    );
    assert(recycled.length > 250, "Old offscreen cards must release their detached DOM trees");
    assert(
      recycleScreen.homeVidaaRetainedCardFragments.size <= 96,
      "Detached static card cache must stay bounded"
    );
    assert(recycleCards[15].childNodes.length === 0, "Far card anchor is a stable empty slot");
    const recycleHeight = recycleViewport.scrollHeight;
    restoreVidaaHomeCard(recycleScreen, recycleCards[15]);
    assert(
      recycleCards[15].firstElementChild !== canonicalOldChild,
      "Old static visual trees must be recreated"
    );
    assert(
      recycleCards[15].querySelector(".content-poster").dataset.src === successfulFallback,
      "Recycling preserves the successful image fallback"
    );
    assert(
      recycleCards[15].querySelector(".home-poster-expanded-backdrop").dataset.loadBound ===
        "false",
      "Recreated expansion can bind a fresh listener"
    );
    assert(
      !recycleCards[15].querySelector("img[src]"),
      "Recreated images remain deferred until needed"
    );
    recycleCards[15].focus({ preventScroll: true });
    recycleCards[15].click();
    assert(
      document.activeElement === recycleCards[15] && anchorClicks === 1,
      "Recycling preserves navigation anchor and delegated interaction"
    );
    assert(recycleViewport.scrollHeight === recycleHeight, "Recycling keeps scroll geometry");
    const refreshed = recyclableMarkup.replace("Title 0-15", "Refreshed title");
    updateHomeDom(container, refreshed, {
      incremental: true,
      focusedNode: recycleCards[15],
      beforeCardUpdate: (card) => restoreVidaaHomeCard(recycleScreen, card)
    });
    assert(
      recycleCards[15].textContent.includes("Refreshed title"),
      "Recycled child snapshots support incremental data updates"
    );
    assert(
      document.activeElement === recycleCards[15],
      "Incremental refresh preserves recycled focus"
    );
    restoreAllVidaaHomeCards(recycleScreen);
    assert(
      container.querySelectorAll(".home-poster-frame").length === 480,
      "All canonical trees remain restorable"
    );
    assert(
      recycleScreen.homeVidaaRetainedCardFragments.size === 0,
      "Restore/cleanup clears the fragment cache"
    );
    container.replaceChildren();
    result.textContent = `PASS: 300 card anchors, ${active} active visual subtrees.\nScroll geometry, focus, listeners, image release, reversal, reconciliation and cleanup verified.`;
    result.dataset.status = "passed";
  } catch (error) {
    result.textContent = "FAIL: " + error.stack;
    result.dataset.status = "failed";
    console.error(error);
  }
</script>
