<!doctype html>
<html lang="en" class="vidaa-tv">
  <meta charset="utf-8" />
  <title>VIDAA new Sources screen (beta) pool</title>
  <base href="/" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <body class="vidaa-tv">
    <div id="app"><div id="stream" class="screen"></div></div>
    <pre id="result" style="position: fixed; opacity: 0; z-index: -1">RUNNING</pre>
    <script>
      globalThis.__NUVIO_PLATFORM__ = "vidaa";
    </script>
    <script type="module">
      // Mounts the new Sources screen with the real CSS and 500 sources from 5 addons, then checks
      // the recycled pool: no layout read or ResizeObserver while navigating, a constant number of
      // row nodes, rows of the fixed pitch, a visible focused row, and the right source for OK and
      // for a pointer click on a recycled row. Badges (T4): pre-created slots that a recycled row
      // refills with its own images and text, broken images hidden, at most three images loading.
      // Player return (T5): row 300 of 500 focused and visible without a layout read.
      const result = document.getElementById("result");
      try {
        const { Router, streamRepository, StreamBadgeSettingsStore, hasFailedAddonLogo } =
          await import("/js/ui/screens/stream/streamScreen.js");
        const { NewSourcesScreen } = await import("/js/ui/tv2/sources/newSourcesScreen.js");
        const { SOURCES_ROW_HEIGHT, SOURCES_ROW_PITCH, SOURCES_LIST_VIEWPORT } =
          await import("/js/ui/tv2/sources/sourcesModel.js");
        const assert = (condition, message) => {
          if (!condition) throw Error(message);
        };
        const navigations = [];
        Router.getCurrent = () => "stream";
        Router.navigate = (route, params) => navigations.push({ route, params });
        Router.popToExistingRoute = () => false;
        Router.back = () => {};
        streamRepository.setLocalPluginSearchPaused = () => {};
        // Declared badges only (no Xperience pack, so no network), addon logos and file sizes.
        const badgeSnapshot = StreamBadgeSettingsStore.snapshot.bind(StreamBadgeSettingsStore);
        StreamBadgeSettingsStore.snapshot = () => ({
          ...badgeSnapshot(),
          rules: { imports: [] },
          showAddonLogo: true,
          showFileSizeBadges: true
        });
        const brokenBadge = "/assets/icons/missing-fixture-badge.webp";
        const brokenLogo = "/assets/icons/missing-fixture-logo.png";
        // Even sources carry image badges (Addon 2 also a broken one), odd sources none: they show
        // technical chips. Addon 2's logo is broken: its initials stand in.
        const groups = Array.from({ length: 5 }, (_, a) => ({
          addonName: `Addon ${a}`,
          addonId: `fixture.addon.${a}`,
          addonOrderIndex: a,
          addonLogo: a === 2 ? brokenLogo : `/assets/icons/discover_compass.svg?logo=${a}`,
          streams: Array.from({ length: 100 }, (_, i) => ({
            name: `Addon ${a}\n${["2160p", "1080p", "720p"][i % 3]}`,
            description: `Fixture.${a}.${i}.mkv\n💾 ${i + 1} GB\n🔊 FR\nextra line`,
            url: `https://fixture.invalid/${a}/${i}.mkv`,
            behaviorHints: { videoSize: (i + 1) * 1024 ** 3 },
            badges:
              i % 2
                ? []
                : [
                    { name: `Pack ${a}-${i}`, imageURL: `/assets/icons/discover_compass.svg?b=${a}-${i}` },
                    ...(a === 2 ? [{ name: "Broken", imageURL: brokenBadge }] : []),
                    ...(i % 4 ? [] : [{ name: "Shared", imageURL: "/assets/icons/ic_player_audio_filled.svg" }])
                  ]
          }))
        }));
        streamRepository.getStreamsFromAllAddons = async (_type, _id, options = {}) => {
          options.onChunk?.({ status: "success", data: groups });
          return { status: "success", data: groups };
        };

        const route = NewSourcesScreen;
        const counts = { reads: 0, observers: 0 };
        const count = () => counts.reads++;
        const rect = Element.prototype.getBoundingClientRect;
        Element.prototype.getBoundingClientRect = function () {
          count();
          return rect.call(this);
        };
        for (const [proto, names] of [
          [HTMLElement.prototype, ["offsetHeight", "offsetTop", "offsetWidth", "offsetLeft"]],
          [Element.prototype, ["clientHeight", "clientWidth", "scrollHeight", "scrollTop"]]
        ]) {
          for (const name of names) {
            const { get, set } = Object.getOwnPropertyDescriptor(proto, name);
            Object.defineProperty(proto, name, {
              configurable: true,
              get() {
                count();
                return get.call(this);
              },
              set
            });
          }
        }
        const NativeObserver = window.ResizeObserver;
        window.ResizeObserver = class extends NativeObserver {
          constructor(callback) {
            counts.observers++;
            super(callback);
          }
        };
        // Images of the pool still loading (src set, no load or error yet): at most three.
        const inflight = new Set();
        let maxInflight = 0;
        // Capture listeners run before the queue's onload starts the next image.
        const settled = (event) => inflight.delete(event.target);
        document.addEventListener("load", settled, true);
        document.addEventListener("error", settled, true);
        const src = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
        Object.defineProperty(HTMLImageElement.prototype, "src", {
          configurable: true,
          get: src.get,
          set(value) {
            if (this.closest(".tv2-sources-row")) {
              inflight.add(this);
              maxInflight = Math.max(maxInflight, inflight.size);
            }
            src.set.call(this, value);
          }
        });
        const removeAttribute = Element.prototype.removeAttribute;
        Element.prototype.removeAttribute = function (name) {
          if (name === "src") inflight.delete(this);
          return removeAttribute.call(this, name);
        };
        const frame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
        const waitFor = async (test) => {
          for (let i = 0; i < 600 && !test(); i++) await frame();
          assert(test(), "Timed out waiting for the Sources screen");
        };
        const press = (key, keyCode, extra = {}) =>
          route.onKeyDown({ key, code: key, keyCode, repeat: false, preventDefault() {}, stopPropagation() {}, ...extra });
        const focused = () => route.container.querySelector(".focused");
        const rows = () => route.container.querySelectorAll(".tv2-sources-row");
        const svg = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="9"/>');

        await route.mount(
          { itemId: "tt-fixture", itemType: "movie", itemTitle: "Fixture", backdrop: svg, startFromBeginning: true },
          {}
        );
        await waitFor(() => route.streamSearchCompleted && focused()?.dataset.action === "playStream");
        assert(route.container.querySelector(".stream-route-shell.tv2-sources"), "the new shell is mounted");
        assert(route.sourcesView.items.length === 500, `500 sources, got ${route.sourcesView.items.length}`);
        const poolSize = rows().length;
        assert(poolSize > 0 && poolSize <= 9, `bounded pool, got ${poolSize} rows`);
        const badgeNodes = () => route.container.querySelectorAll(".tv2-sources-row .stream-route-stream-badge").length;
        assert(badgeNodes() === poolSize * 10, `ten badge slots per row, got ${badgeNodes()}`);
        assert(!route.container.querySelector(".tv2-sources-row img[loading]"), "no lazy images");
        // Every drawn row shows the badges, logo and size of the source it holds.
        const checkRows = async (label) => {
          await waitFor(() => !inflight.size);
          for (const row of [...rows()].filter((node) => !node.hidden)) {
            const card = row.querySelector("[data-action='playStream']");
            const stream = route.sourcesView.items[Number(card.dataset.streamRow)];
            assert(card.dataset.streamId === stream.id, `${label}: row ${card.dataset.streamRow} holds its source`);
            const slots = [...row.querySelectorAll(".stream-route-stream-badge")].filter((node) => !node.hidden);
            const size = slots.pop();
            assert(size?.classList.contains("size") && /GB/.test(size.textContent), `${label}: size chip last`);
            const images = stream.badges.map((badge) => badge.imageURL).filter((url) => url !== brokenBadge);
            if (images.length) {
              assert(
                slots.length === images.length &&
                  slots.every((node, i) => node.classList.contains("image") && node.querySelector("img").getAttribute("src") === images[i]),
                `${label}: row ${card.dataset.streamRow} shows its own images, the broken one hidden`
              );
            } else {
              assert(
                slots.length > 0 && slots.every((node) => node.classList.contains("technical") && node.textContent && node.querySelector("img").hidden),
                `${label}: row ${card.dataset.streamRow} shows technical chips`
              );
            }
            assert(row.querySelector(".stream-route-card-quality").hidden, `${label}: badges replace the quality line`);
            const logo = row.querySelector(".stream-route-addon-badge img");
            const initials = row.querySelector(".stream-route-addon-badge span");
            const logoBroken = stream.addonName === "Addon 2";
            assert(
              logo.hidden === logoBroken && initials.hidden === !logoBroken &&
                (logoBroken || logo.getAttribute("src") === stream.addonLogo),
              `${label}: row ${card.dataset.streamRow} logo or initials`
            );
          }
        };
        await checkRows("first rows");

        // Navigation: 300 Down, 10 Up, filters both ways. Nothing measures the layout.
        counts.reads = counts.observers = 0;
        const nodesBefore = route.container.getElementsByTagName("*").length;
        for (let i = 0; i < 300; i++) {
          press("ArrowDown", 40);
          if (i % 25 === 0) await frame();
        }
        for (let i = 0; i < 10; i++) press("ArrowUp", 38);
        await frame();
        assert(route.focusState.row === 290, `row 290 focused, got ${route.focusState.row}`);
        assert(focused().dataset.streamRow === "290", "the focused node is row 290");
        assert(
          focused().dataset.streamId === route.sourcesView.items[290].id,
          "the focused node shows the source of its row"
        );
        assert(counts.reads === 0 && counts.observers === 0, `no layout read while moving (${counts.reads}, ${counts.observers})`);
        assert(rows().length === poolSize, "the row pool does not grow");
        assert(route.container.getElementsByTagName("*").length === nodesBefore, "the DOM node count is constant");
        const recycled = [...rows()].find((row) => !row.hidden && row.querySelector(".focusable") !== focused());
        assert(badgeNodes() === poolSize * 10, "the badge slots are recycled");
        await checkRows("after 300 Down");
        assert(hasFailedAddonLogo(brokenBadge) && hasFailedAddonLogo(brokenLogo), "failed images are remembered");
        assert(maxInflight > 0 && maxInflight <= 3, `at most three images loading, got ${maxInflight}`);

        // Fixed geometry, checked here only: the row is the pitch minus the gap, the list shows
        // the viewport, and the focused row is inside it.
        const list = route.container.querySelector(".stream-route-list");
        const card = focused().getBoundingClientRect();
        const listBox = list.getBoundingClientRect();
        assert(focused().closest(".tv2-sources-row").offsetHeight === SOURCES_ROW_HEIGHT, "row height");
        assert(SOURCES_ROW_PITCH === SOURCES_ROW_HEIGHT + 12, "pitch");
        assert(list.clientHeight - 16 === SOURCES_LIST_VIEWPORT, `list viewport ${list.clientHeight - 16}`);
        assert(card.top >= listBox.top + 8 && card.bottom <= listBox.bottom - 8, "the focused row is visible");

        // Filters: Right on a card, then back to All; still no measurement.
        counts.reads = 0;
        press("ArrowRight", 39);
        assert(route.addonFilter === "Addon 0", `filter Addon 0, got ${route.addonFilter}`);
        assert(route.focusState.row === 0 && focused().dataset.streamRow === "0", "a new filter starts at its top");
        press("ArrowLeft", 37);
        assert(route.addonFilter === "all", "back to All");
        assert(counts.reads === 0, `no layout read on filters (${counts.reads})`);
        for (let i = 0; i < 3; i++) press("ArrowDown", 40);

        // OK plays the focused source; a held OK does not repeat it.
        const expected = focused().dataset.streamId;
        press("Enter", 13);
        press("Enter", 13, { repeat: true });
        await waitFor(() => navigations.length);
        await new Promise((resolve) => setTimeout(resolve, 50));
        assert(navigations.length === 1, `one playback, got ${navigations.length}`);
        assert(navigations[0].route === "player" && navigations[0].params.preferredStreamId === expected, "OK plays the focused source");

        // A pointer click on a recycled row plays that row's source.
        const recycledCard = recycled.querySelector("[data-action='playStream']");
        const recycledRow = Number(recycledCard.dataset.streamRow);
        route.onPointerActivate(recycledCard);
        await waitFor(() => navigations.length === 2);
        assert(
          navigations[1].params.preferredStreamId === route.sourcesView.items[recycledRow].id,
          "a recycled row plays the source it shows"
        );
        assert(route.focusState.row === recycledRow, "the pointer focuses that row");

        // Back from the player (T5) on row 300 of 500: the same source is drawn and focused at once,
        // its offset from the fixed geometry, without reading the layout.
        while (route.focusState.row < 300) press("ArrowDown", 40);
        await frame();
        const playedId = route.sourcesView.items[300].id;
        const restoredState = route.captureRouteState();
        assert(restoredState.focusState.streamId === playedId, "the snapshot holds the focused source");
        route.cleanup();
        counts.reads = counts.observers = 0;
        const backContext = { isBackNavigation: true, previousRoute: "player" };
        await route.mount(restoredState.params, { ...backContext, restoredState });
        assert(focused()?.dataset.streamId === playedId && focused().dataset.streamRow === "300", "row 300 focused on return");
        assert(counts.reads === 0 && counts.observers === 0, `no layout read on return (${counts.reads}, ${counts.observers})`);
        const returnCard = focused().getBoundingClientRect();
        const returnList = route.container.querySelector(".stream-route-list").getBoundingClientRect();
        assert(returnCard.top >= returnList.top + 8 && returnCard.bottom <= returnList.bottom - 8, "the returned row is visible");
        // Evicted snapshot: a fresh search focuses the source named by the route.
        route.cleanup();
        const evictedId = restoredState.streams.at(-1).id;
        await route.mount({ ...restoredState.params, preferredStreamId: evictedId }, { ...backContext, restoredState: null });
        await waitFor(() => route.streamSearchCompleted && focused()?.dataset.streamId === evictedId);
        assert(
          route.focusState.row === route.sourcesView.items.findIndex((stream) => stream.id === evictedId) && route.focusState.row > 300,
          `the preferred source is focused, got row ${route.focusState.row}`
        );

        // Back keeps the StreamScreen navigation; cleanup releases the pool.
        press("Escape", 27);
        assert(navigations.at(-1).route === "detail", `Back opens the detail, got ${navigations.at(-1).route}`);
        route.cleanup();
        assert(!route.container.querySelector(".tv2-sources-row") && !route.sourcesRenderer, "cleanup releases the pool");

        // A slot recycled to another badge with the same image, while that image is still loading,
        // hides it when it fails.
        const { createSourcesRenderer } = await import("/js/ui/tv2/sources/sourcesRenderer.js");
        const host = document.createElement("div");
        document.body.appendChild(host);
        const failing = "/assets/icons/missing-recycled-badge.webp";
        const recycler = createSourcesRenderer(host, { header: { title: "Recycle" }, skeletonMarkup: "", moreMarkup: "" });
        const badgeView = (id) => ({
          items: [{ id, name: id }],
          keys: [id],
          chipKeys: ["all"],
          filter: "all",
          chipStatus: () => "success",
          isPartySource: () => false,
          showAddonLogo: false,
          badgesFor: () => [{ kind: "image", url: failing, alt: id, style: "" }],
          logoFor: () => "",
          loading: false,
          more: false,
          message: "",
          resetScroll: true
        });
        recycler.update(badgeView("first"), { zone: "card", row: 0 });
        recycler.update(badgeView("second"), { zone: "card", row: 0 });
        await waitFor(() => hasFailedAddonLogo(failing));
        await frame();
        assert(host.querySelector(".tv2-sources-row:not([hidden]) .stream-route-stream-badge").hidden, "a recycled broken badge is hidden");
        recycler.dispose();
        host.remove();
        result.textContent = `PASS: 500 sources in a pool of ${poolSize} rows, no layout read while navigating, recycled badges and logos (≤${maxInflight} loading), OK/pointer/Back on the right source, player return on row 300 without layout read.`;
      } catch (error) {
        result.textContent = `FAIL: ${error?.stack || error}`;
      }
    </script>
  </body>
</html>
