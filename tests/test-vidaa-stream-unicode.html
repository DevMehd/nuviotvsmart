<!doctype html>
<html class="vidaa-tv">
  <meta charset="utf-8" />
  <title>VIDAA stream labels</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <div id="streams" class="stream-route-list"></div>
  <pre id="result">Testing...</pre>
  <script type="module">
    globalThis.__NUVIO_PLATFORM__ = "vidaa";
    try {
      const { StreamScreen, selectAutoPlayStream, getAddonBadgeLabel } =
        await import("../js/ui/screens/stream/streamScreen.js");
      const variants = ["𝐈t", "🇮t", "𝘐𝘵", "𝕀𝕋", "ℐ𝒯", "ＩＴ", "🅸🆃", "I\u200bT", "🇮🇹", "ɪᴛ"];
      const streams = variants.map((label, index) => ({
        id: `stream-${index}`,
        name: `Audio: ${label}`,
        description: `${label}\nCittà 日本語 العربية 👩‍💻\nTeach You A Lesson s₀₁·ᴇ₁₀\n✓ ɪᴛ · ᴇɴ · sᴜʙ (ɪᴛᶠᵒʳᶜᵉᵈ)`,
        url: `https://fixture.invalid/${index}`
      }));
      const original = JSON.stringify(streams);
      document.getElementById("streams").innerHTML = streams
        .map((stream, index) =>
          StreamScreen.renderStreamCard.call(
            { isCardActionFocused: () => false },
            stream,
            index,
            false,
            { showAddonLogo: false }
          )
        )
        .join("");
      const headings = [...document.querySelectorAll(".stream-route-card-heading")];
      if (headings.length !== variants.length) throw Error("Missing stream cards");
      headings.forEach((heading, index) => {
        if (!/^Audio: (?:It|IT|\[IT\])$/i.test(heading.textContent))
          throw Error(`Unreadable heading ${heading.textContent}`);
        const selected = selectAutoPlayStream(
          [{ name: "English", url: "https://fixture.invalid/en" }, streams[index]],
          {
            mode: "REGEX_MATCH",
            regexPattern: "\\bIT\\b"
          }
        );
        if (selected !== streams[index]) throw Error(`Language filter missed ${variants[index]}`);
      });
      const text = document.getElementById("streams").textContent;
      if (!text.includes("Città 日本語 العربية 👩‍💻")) throw Error("Unrelated text changed");
      if (!text.includes("Teach You A Lesson s01·e10")) throw Error("Episode label not readable");
      if (!text.includes("✓ it · en · sub (itforced)"))
        throw Error("AIO audio/subtitle labels not readable");
      const decoratedAddon = "𝐀𝐝𝐝𝐨𝐧 ɪᴛ";
      const addonLabels = document.createElement("div");
      addonLabels.innerHTML =
        StreamScreen.renderChip(decoratedAddon, true, "success") +
        StreamScreen.renderStreamCard.call(
          { isCardActionFocused: () => false },
          { ...streams[0], addonName: decoratedAddon },
          0,
          false,
          { showAddonLogo: true }
        );
      document.body.appendChild(addonLabels);
      if (addonLabels.querySelector(".stream-route-chip span").textContent !== "Addon it")
        throw Error("Addon filter label not readable");
      if (addonLabels.querySelector(".stream-route-chip").dataset.addon !== decoratedAddon)
        throw Error("Addon filter identity changed");
      if (addonLabels.querySelector(".stream-route-addon-name").textContent !== "Addon it")
        throw Error("Addon card label not readable");
      if (getAddonBadgeLabel(decoratedAddon) !== "AI" || getAddonBadgeLabel("🎧 日本語") !== "🎧日")
        throw Error("Addon initials split a Unicode character");
      if (JSON.stringify(streams) !== original) throw Error("Source metadata changed");
      document.getElementById("result").textContent =
        "PASS: stream descriptions, addon names/filters and Unicode initials are readable; original metadata/filter identities and language matching are preserved";
    } catch (error) {
      document.getElementById("result").textContent = `FAIL: ${error.stack || error}`;
    }
  </script>
</html>
