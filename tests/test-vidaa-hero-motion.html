<!doctype html>
<html class="vidaa-tv vidaa-balanced-motion">
  <meta charset="utf-8" /><title>VIDAA artwork motion regression</title>
  <style>
    body {
      background: #121212;
      color: white;
      font: 20px sans-serif;
    }
    #scene {
      position: relative;
      width: 640px;
      height: 360px;
      overflow: hidden;
    }
    #scene img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <div id="scene"><img alt="First scene" /></div>
  <pre id="result">Testing artwork transitions…</pre>
  <script type="module">
    import { swapVidaaHeroImage } from "../js/ui/screens/home/vidaaHeroTransition.js";
    const image = document.querySelector("img"),
      result = document.querySelector("#result");
    const source = (color) =>
      "data:image/svg+xml," +
      encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="640" height="360" fill="${color}"/></svg>`
      );
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const assert = (value, message) => {
      if (!value) throw Error(message);
    };
    try {
      image.src = source("teal");
      await image.decode();
      swapVidaaHeroImage(image, source("purple"), "Second scene", "backdrop", 200);
      await wait(70);
      assert(
        document.querySelectorAll("#scene img").length === 2,
        "Previous scene remains below new artwork"
      );
      assert(image.getAnimations().length === 1, "Browser runs one compositor animation");
      assert(
        Number(getComputedStyle(image).opacity) > 0 && Number(getComputedStyle(image).opacity) < 1,
        "Incoming image has intermediate opacity"
      );
      for (let index = 0; index < 15; index++) {
        swapVidaaHeroImage(
          image,
          source(index % 2 ? "teal" : "purple"),
          "Interrupted scene",
          "backdrop",
          200
        );
        await wait(20);
        assert(
          document.querySelectorAll("#scene img").length <= 2,
          "Interrupted changes cannot accumulate layers"
        );
      }
      await wait(270);
      assert(
        document.querySelectorAll("#scene img").length === 1,
        "Old layer is released after settling"
      );
      assert(image.getAnimations().length === 0, "No animation remains running");
      assert(Number(getComputedStyle(image).opacity) === 1, "Settled artwork is opaque");
      result.textContent =
        "PASS: real browser fades, 15 rapid interruptions, two layers maximum, complete cleanup.";
      result.dataset.status = "passed";
    } catch (error) {
      result.textContent = "FAIL: " + error.message;
      result.dataset.status = "failed";
    }
  </script>
</html>
